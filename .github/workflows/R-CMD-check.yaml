# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    # A stalled network read must not hold a runner for hours (#16).
    timeout-minutes: 45

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          # disable r-devel on ubuntu due to 
          # hanging build of duckdb
          # TODO: re-enable at some point
          # - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # rcmdcheck runs R CMD build through callr, whose temporary
      # R_PROFILE and R_PROFILE_USER call .libPaths() with the library
      # paths of the calling session. The R that Quarto starts to knit the
      # vignette inherits them, and on Windows nothing clears them (on
      # Unix, the --vanilla of R CMD build's vignette process does), so
      # they drop the temporary library R CMD build installed omicidxr
      # into: "there is no package called 'omicidxr'". Skip both profiles.
      # https://github.com/quarto-dev/quarto-r/issues/217
      - uses: r-lib/actions/check-r-package@v2
        env:
          QUARTO_KNITR_RSCRIPT_ARGS: --no-site-file,--no-init-file
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  BiocCheck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: bioc::BiocCheck
          needs: check

      # Fails on ERROR only. The mailing-list and support-site checks need
      # the maintainer's credentials, so they are skipped here.
      - name: BiocCheck
        run: |
          BiocCheck::BiocCheck(
            ".",
            `quit-with-status` = TRUE,
            `no-check-bioc-help` = TRUE
          )
        shell: Rscript {0}
